<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Test certificates{% endblock %}</title>
  <meta name="description" content="Make IS 4984 test certificates for the new entries in a production register.">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='mark.svg') }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="{{ url_for('choose_files') }}" aria-label="Test certificates, start again">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle class="mark-wall" cx="16" cy="16" r="15"/>
          <circle class="mark-bore" cx="16" cy="16" r="9.5"/>
          <path class="mark-tick" d="M11.6 16.4l3 3 6-6.4"/>
        </svg>
        <span class="brand-text">
          <span class="brand-tool">Test certificates</span>
          <span class="brand-sub">HDPE pipes, IS 4984</span>
        </span>
      </a>
      <ol class="steps" aria-label="Steps">
        {% for label in ["Choose files", "Check entries", "Download"] %}
        <li{% if loop.index == step %} aria-current="step"{% elif loop.index < step %} class="done"{% endif %}>
          <span class="step-key" aria-hidden="true"><span class="step-n">{{ loop.index }}</span><svg class="step-tick" viewBox="0 0 16 16"><path d="M3.5 8.4l3 3 6-6.6"/></svg></span>
          <span class="step-label">{{ label }}</span>
        </li>
        {% endfor %}
      </ol>
    </div>
  </header>
  <main>
    <div class="page" id="content">
    {% block main %}{% endblock %}
    </div>
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
